<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Core Orb Gradient -->
    <linearGradient id="logo-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="logo-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="60%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Mark Group -->
  <g transform="translate(10, 0)">
    <!-- Base Glow -->
    <circle cx="40" cy="40" r="32" fill="#00F2FE" opacity="0.05"/>

    <!-- Ellipse Ring 1 (-25deg) -->
    <g transform="translate(40,40) rotate(-25)">
      <ellipse cx="0" cy="0" rx="30" ry="11" fill="none" stroke="url(#logo-ring)" stroke-width="2" stroke-dasharray="3 1.5"/>
      <circle cx="28" cy="-4" r="3.5" fill="#00F2FE" filter="url(#logo-glow)"/>
      <circle cx="28" cy="-4" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Ellipse Ring 2 (+35deg) -->
    <g transform="translate(40,40) rotate(35)">
      <ellipse cx="0" cy="0" rx="28" ry="9" fill="none" stroke="#8B5CF6" stroke-width="1.75" opacity="0.8"/>
      <circle cx="-26" cy="3" r="2.5" fill="#8B5CF6"/>
    </g>

    <!-- Central Core -->
    <circle cx="40" cy="40" r="12" fill="url(#logo-core)" filter="url(#logo-glow)"/>
    <circle cx="40" cy="40" r="7.5" fill="#07090E" opacity="0.35"/>
    <circle cx="40" cy="40" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark "ORBIT" -->
  <text x="96" y="47" font-family="'Inter', 'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="3" fill="url(#text-grad)">
    ORBIT
  </text>

  <!-- Subtitle Tag "AUTONOMOUS DATA OPS" -->
  <text x="98" y="62" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8.5" font-weight="600" letter-spacing="2" fill="#38BDF8" opacity="0.9">
    AUTONOMOUS DATA OPS
  </text>

  <!-- Telemetry Pulse Indicator Dot -->
  <circle cx="242" cy="38" r="3" fill="#10B981" filter="url(#logo-glow)"/>
  <circle cx="242" cy="38" r="1.2" fill="#FFFFFF"/>
</svg>
