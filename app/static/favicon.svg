<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="space-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#07090E"/>
    </radialGradient>

    <!-- Core Orb Gradient -->
    <linearGradient id="orb-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Orbital Trajectory Ring 1 -->
    <linearGradient id="orbit-ring-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Orbital Trajectory Ring 2 -->
    <linearGradient id="orbit-ring-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Base with Rounded Corners -->
  <rect width="128" height="128" rx="28" fill="url(#space-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Back Orbit Ellipse (Tilted -28deg) -->
  <g transform="translate(64,64) rotate(-28)">
    <ellipse cx="0" cy="0" rx="46" ry="16" fill="none" stroke="url(#orbit-ring-1)" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.75"/>
  </g>

  <!-- Secondary Crossed Ellipse (Tilted +35deg) -->
  <g transform="translate(64,64) rotate(35)">
    <ellipse cx="0" cy="0" rx="44" ry="14" fill="none" stroke="url(#orbit-ring-2)" stroke-width="2"/>
  </g>

  <!-- Central Planetary Data Core -->
  <circle cx="64" cy="64" r="18" fill="url(#orb-core)" filter="url(#glow)"/>
  
  <!-- Inner Core Shadow / Telemetry Rings -->
  <circle cx="64" cy="64" r="12" fill="#07090E" opacity="0.4"/>
  <circle cx="64" cy="64" r="6" fill="#FFFFFF" opacity="0.95"/>

  <!-- Autonomous Satellite Probe on Orbit 1 -->
  <g transform="translate(64,64) rotate(-28)">
    <!-- Probe position on ellipse (46, 0) -->
    <circle cx="44" cy="-5" r="5" fill="#00F2FE" filter="url(#glow)"/>
    <circle cx="44" cy="-5" r="2.5" fill="#FFFFFF"/>
    <!-- Signal waves emitted from probe -->
    <path d="M 52 -9 A 7 7 0 0 1 52 -1" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Secondary Satellite Node on Orbit 2 -->
  <g transform="translate(64,64) rotate(35)">
    <circle cx="-42" cy="4" r="4" fill="#8B5CF6" filter="url(#glow)"/>
    <circle cx="-42" cy="4" r="2" fill="#FFFFFF"/>
  </g>
</svg>
