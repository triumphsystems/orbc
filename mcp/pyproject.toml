[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orbc-mcp"
version = "0.2.0"
description = "orbc - Model Context Protocol (MCP) server for Orbit Autonomous Web Data Operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
orbc-mcp = "orbit.server:main"
orbc = "orbit.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orbit*"]

