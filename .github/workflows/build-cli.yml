name: Build & Release Orbit CLI (orbc)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'cli/**'
      - '.github/workflows/build-cli.yml'
  pull_request:
    paths:
      - 'cli/**'
  workflow_dispatch:

env:
  PROD_API_URL: "https://orbit-wtsx.onrender.com"

jobs:
  build:
    name: Build Cross-Platform Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            binary: orbc-linux-amd64
          - os: linux
            arch: arm64
            binary: orbc-linux-arm64
          - os: darwin
            arch: amd64
            binary: orbc-darwin-amd64
          - os: darwin
            arch: arm64
            binary: orbc-darwin-arm64
          - os: windows
            arch: amd64
            binary: orbc-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: cli/go.sum

      - name: Build CLI Binary
        working-directory: cli
        run: |
          mkdir -p ../bin
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
            -ldflags "-s -w -X github.com/leoemaxie/orbit/cli/internal/config.DefaultAPIURL=${{ env.PROD_API_URL }}" \
            -o ../bin/${{ matrix.binary }} \
            ./cmd/orbc

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: bin/${{ matrix.binary }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Binaries
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-binaries/*
          generate_release_notes: true
